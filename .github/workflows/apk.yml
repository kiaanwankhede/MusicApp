name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web assets
        run: mkdir www && cp index.html manifest.webmanifest icon.svg sw.js www/ && (cp -r voices www/ 2>/dev/null || true)
      - name: Create Android project (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Tiny Tunes" com.kiaanwankhede.tinytunes --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          grep RECORD_AUDIO android/app/src/main/AndroidManifest.xml
      - name: Keep the screen on while the app is open
        run: |
          cat > android/app/src/main/java/com/kiaanwankhede/tinytunes/MainActivity.java <<'EOF'
          package com.kiaanwankhede.tinytunes;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }
          }
          EOF
          cat android/app/src/main/java/com/kiaanwankhede/tinytunes/MainActivity.java
      - name: Use fixed signing key (so updates install over old versions)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TinyTunes.apk
      - uses: actions/upload-artifact@v4
        with: { name: TinyTunes-apk, path: TinyTunes.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Tiny Tunes v1.${{ github.run_number }}
          files: TinyTunes.apk

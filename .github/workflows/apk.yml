name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web assets
        run: mkdir www && cp index.html fonts.css manifest.webmanifest icon.svg sw.js www/ && ls -la www
      - name: Create Android project (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Tiny Tunes" com.kiaanwankhede.tinytunes --web-dir=www
          # bridge logging off: plugin calls (backing tracks, the data export about him) are not copied into logcat
          rm -f capacitor.config.ts capacitor.config.js
          echo '{"appId":"com.kiaanwankhede.tinytunes","appName":"Tiny Tunes","webDir":"www","loggingBehavior":"none"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          grep RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          grep loggingBehavior android/app/src/main/assets/capacitor.config.json
      - name: Add the native code (MainActivity + TinyTunes plugin)
        run: |
          DEST=android/app/src/main/java/com/kiaanwankhede/tinytunes
          test -d "$DEST"
          cp -f android-src/*.java "$DEST"/
          for f in "$DEST"/*.java; do echo "===== $f"; cat "$f"; done
      - name: Use fixed signing key (so updates install over old versions)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TinyTunes.apk
      - uses: actions/upload-artifact@v4
        with: { name: TinyTunes-apk, path: TinyTunes.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.${{ github.run_number }}
          name: Tiny Tunes v3.${{ github.run_number }}
          files: TinyTunes.apk
